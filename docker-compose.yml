services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
      
  rag_engine:
    build:
      context: ./rag_engine  # ton Dockerfile de rag_engine
    container_name: rag_engine
    env_file: .env  
    depends_on:
      - qdrant
    volumes:
      - ./data:/data  # pour que les recettes soient accessibles dans le conte  neur
      - ./rag_engine:/app

    command: tail -f /dev/null  # pour garder le conteneur en vie, tu remplaceras ça par la commande de ton moteur RAG
  
  api:
    build:
      context: ./api
    container_name: api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./api:/app
      - ./rag_engine:/app/rag_engine  # pour que l'API puisse accéder au code de rag_engine

    frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api